apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: orders-consumer-scaledobject
  namespace: orders
spec:
  scaleTargetRef:
    name: orders-consumer
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 30
  cooldownPeriod: 120
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: kafka-test.kafka.svc.cluster.local:9092
      consumerGroup: orders-consumer
      lagThreshold: "100"
      offsetResetPolicy: latest
