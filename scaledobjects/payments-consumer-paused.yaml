apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: payments-consumer-scaledobject
  namespace: payments
  annotations:
    # Behavioral: KEDA holds the target at its current replica count.
    autoscaling.keda.sh/paused: "true"
    # Helm provenance (stripped by keda-import's blind-copy denylist).
    meta.helm.sh/release-name: payments
    meta.helm.sh/release-namespace: payments
    # Custom business annotations (preserved by blind copy).
    example.com/owner: platform-team
    example.com/change-ticket: CHG-4821
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: payments-consumer
    app.kubernetes.io/part-of: data-platform
    app.kubernetes.io/component: consumer
    team: payments
    cost-center: eng-1042
    environment: production
spec:
  scaleTargetRef:
    name: payments-consumer
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 30
  cooldownPeriod: 120
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: kafka-test.kafka.svc.cluster.local:9092
      consumerGroup: payments-consumer
      lagThreshold: "200"
      offsetResetPolicy: latest
